name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 */4 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/bandas?select=id&limit=1" \n            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \n            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
