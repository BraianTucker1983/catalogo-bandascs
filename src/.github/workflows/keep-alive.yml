name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 0 */4 * *" # Ejecuta automáticamente cada 4 días
  workflow_dispatch: # Permite probarlo manualmente desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/bandas?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
