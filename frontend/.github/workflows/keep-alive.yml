name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta automáticamente cada 3 días a medianoche (UTC)
    - cron: "0 0 */3 * *"
  workflow_dispatch: # Permite probarlo manualmente desde GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/bandas?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            > /dev/null && echo "Supabase despertado con éxito"
